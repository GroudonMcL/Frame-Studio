name: Windows installer

# Builds Frame-Studio-Setup-<version>.exe on Windows and checks it installs.
# Run it by hand from the Actions tab (Run workflow), or push a tag such as
# v0.5.0 to also attach the installer to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run installer

      - name: Install it silently and check the app is there
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\Frame-Studio-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Frame Studio\Frame Studio.exe'
          if (-not (Test-Path $exe)) { throw "Frame Studio.exe was not installed" }
          Write-Host "Installed: $exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Frame-Studio-Setup
          path: release/Frame-Studio-Setup-*.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\Frame-Studio-Setup-*.exe | Select-Object -First 1
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "Frame Studio $env:GITHUB_REF_NAME" --notes "Download Frame-Studio-Setup and run it to install Frame Studio on Windows." }
          gh release upload $env:GITHUB_REF_NAME $setup.FullName --clobber
